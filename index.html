/* Filet de securite : si le script principal casse (y compris une erreur de syntaxe,
   signalee avant que le DOM soit pret), on affiche l'erreur au lieu de laisser un ecran
   vide. Diagnostic complet dans la console (F12) : tfCheck() */
window.__tfErr=null;
function tfShow(){
  if(!window.__tfErr)return;
  var v=document.getElementById("view");
  if(!v)return;
  if(v.querySelector("[data-tferr]"))return;
  function mk(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x)n.textContent=x;return n;}
  var card=mk("div","card");card.setAttribute("data-tferr","1");
  var h2=mk("h2");h2.appendChild(mk("span","","Oups"));card.appendChild(h2);
  card.appendChild(mk("p","mut","Le script de l'app n'a pas pu demarrer dans ce navigateur. Voici ce qu'il signale :"));
  var err=mk("p","","\u26a0 "+window.__tfErr);
  err.style.cssText="margin:0 0 10px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#ff6b9d;word-break:break-word";
  card.appendChild(err);
  card.appendChild(mk("p","tiny mut","Cause la plus frequente : la page est ouverte dans le navigateur integre d'une application (apercu d'un lien, messagerie, autre site), ou un bloqueur / une extension desactive le JavaScript. Ouvre l'adresse dans une vraie fenetre de Chrome, Edge, Safari ou Firefox, puis F12 onglet Console."));
  var b=mk("button","pri","Recharger");b.onclick=function(){location.reload();};card.appendChild(b);
  v.appendChild(card);
}
window.addEventListener("error",function(e){
  window.__tfErr=(e&&e.message?e.message:"erreur")+(e&&e.lineno?" (ligne "+e.lineno+")":"");
  tfShow();
  setTimeout(tfShow,0);
  document.addEventListener("DOMContentLoaded",tfShow);
  window.addEventListener("load",tfShow);
});
window.tfCheck=function(){
  var d={};
  try{d["script execute"]=(typeof render==="function");}catch(e){d["script execute"]=false;}
  try{d["STATE charge"]=!!(typeof STATE!=="undefined"&&STATE&&STATE.profiles);}catch(e){d["STATE charge"]=false;}
  try{d["profils"]=(typeof STATE!=="undefined"&&STATE)?STATE.profiles.length:"-";}catch(e){}
  try{d["localStorage"]=(typeof localStorage!=="undefined"&&localStorage!==null);}catch(e){d["localStorage"]="bloque";}
  try{d["serviceWorker"]=("serviceWorker" in navigator);}catch(e){}
  try{d["manifest"]=(typeof document!=="undefined")&&!!document.querySelector('link[rel="manifest"]');}catch(e){}
  d["erreur capturée"]=window.__tfErr||"aucune";
  console.table(d);return d;
};

/* ============================================================ DATES */
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function t0(s){const a=String(s).split("-").map(Number);return Date.UTC(a[0],(a[1]||1)-1,a[2]||1);}
function addDays(s,n){return ymd(new Date(t0(s)+n*DAY));}
function curWeek(){const d=new Date();const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const w=(x.getUTCDay()+6)%7;x.setUTCDate(x.getUTCDate()-w);return ymd(x);}
function monthKey(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function fmtD(s){const a=String(s).split("-");return a[2]+"/"+a[1];}
function daysLeft(s){return Math.ceil((t0(s)-t0(today()))/DAY);}
function wkKey(dateStr){return dateStr?weekOf(t0(dateStr)):curWeek();}
function weekOf(ms){const x=new Date(ms);const w=(x.getUTCDay()+6)%7;x.setUTCDate(x.getUTCDate()-w);return ymd(x);}

/* ============================================================ CALCULS */
function sess(p){return p.demo?p.sessions:p.sessions.filter(x=>!x.demo);}
function wts(p){return p.demo?p.weights:p.weights.filter(x=>!x.demo);}
function lapsOf(p){const L=p.settings&&p.settings.pref&&p.settings.pref.pool;return L||0;}
function totalMin(p){return sess(p).reduce((a,s)=>a+(s.min||0),0);}
function streakDays(p){
  const set=new Set();
  sess(p).forEach(s=>set.add(s.date));
  wts(p).forEach(w=>set.add(w.date));
  Object.keys(p.habits||{}).forEach(k=>{if((p.habits[k]||[]).filter(Boolean).length>0)set.add(k);});
  let n=0,c=today();
  if(!set.has(c))c=addDays(c,-1);
  while(set.has(c)&&n<400){n++;c=addDays(c,-1);}
  return n;
}
function habCount(p,d){return (p.habits&&p.habits[d]?p.habits[d]:[]).filter(Boolean).length;}
function habDaysThisWeek(p){const start=t0(curWeek());let n=0;for(let i=0;i<7;i++){if(habCount(p,ymd(new Date(start+i*DAY)))>=2)n++;}return n;}
function activeWeeks(p){return new Set(sess(p).map(s=>wkKey(s.date))).size;}
function weekMin(p,k){return sess(p).filter(s=>wkKey(s.date)===k).reduce((a,s)=>a+(s.min||0),0);}
function goalLost(p){
  if(!p.goal||p.goal.metric!=="kg")return 0;
  const w=wts(p).slice().sort((a,b)=>a.date<b.date?-1:1);
  if(!w.length)return 0;
  const from=p.goal.start!=null?p.goal.start:w[0].kg;
  const cur=Math.max(0,+(from-w[w.length-1].kg).toFixed(2));
  if(cur>(p.bestLost||0))p.bestLost=cur;      /* le record reste acquis */
  return cur;
}
function bestLost(p){
  goalLost(p);
  return p.bestLost||0;
}
function targetMin(p){return Math.max(20,Math.round(((p.goal&&p.goal.weeklyMin)||60)/10)*10);}
function idealValue(p){
  const g=p.goal;
  if(!g||g.start==null||g.target==null||!g.startD||!g.targetD)return null;
  const a=t0(g.startD),b=t0(g.targetD);
  if(b<=a)return null;
  const f=Math.max(0,Math.min(1.2,(t0(today())-a)/(b-a)));
  if(g.metric==="kg"){
    const ideal=g.start-(g.start-g.target)*f;
    return +Math.min(g.start,Math.max(g.target,ideal)).toFixed(2);
  }
  return +(g.start+(g.target-g.start)*f).toFixed(1);
}
function paceDelta(p){
  const g=p.goal;
  if(!g||g.metric!=="kg"||g.start==null||g.target==null)return null;
  const ideal=idealValue(p);if(ideal==null)return null;
  const w=wts(p).slice().sort((a,b)=>a.date<b.date?-1:1);
  const now=w.length?w[w.length-1].kg:(g.curr!=null?g.curr:g.start);
  return +(ideal-now).toFixed(2);
}
function xpOf(p){
  const sp=SPORTS[p.sport]||SPORTS.autre;
  let x=0;
  sess(p).forEach(s=>{
    const min=s.min||0, int=s.int||2;
    x+=min*(SPORTS[s.sport]?SPORTS[s.sport].xpMin:sp.xpMin)+25;
    x+=int>=4?30:int===3?10:0;
    if(min>=60)x+=20; if(min>=90)x+=30; if(min>=120)x+=50;
    if(s.hiit)x+=50;
    if(s.m)x+=Math.round(s.m*0.2);
    if(s.laps&&lapsOf(p))x+=Math.round(s.laps*0.5);
  });
  x+=wts(p).length*20;
  Object.keys(p.habits||{}).forEach(k=>{x+=habCount(p,k)*5;});
  const j=p.settings&&p.settings.joker;
  if(j&&j.week===curWeek()&&j.used)x+=30;
  x+=(p.bosses||[]).filter(b=>b.done).length*300;
  if(p.goal&&p.goal.metric==="kg")x+=Math.round(bestLost(p)*100);
  if(p.goal&&p.goal.metric==="km")x+=Math.round(sess(p).reduce((a,s)=>a+(s.km||0),0)*20);
  x+=p.badges.length*100;
  x+=Object.values(p.quests||{}).filter(v=>v>=4).length*40;
  return Math.round(x);
}
function lvlOf(x){let i=0;for(let k=0;k<LEVELS.length;k++)if(x>=LEVELS[k].xp)i=k;return i;}
function levelName(p,i){const f=FLAVOR[p.sport]||FLAVOR.autre;return f[Math.max(0,Math.min(9,i))];}
function questState(p){
  const w=curWeek();
  if(p.questW!==w){p.questW=w;}
  const nS=sess(p).filter(s=>wkKey(s.date)===w).length;
  const m=weekMin(p,w), tm=targetMin(p), hd=habDaysThisWeek(p);
  const weighed=wts(p).some(x=>wkKey(x.date)===w)?1:0;
  const qs=[
    {t:"2 séances",d:"Deux, c'est déjà une semaine.",p:Math.min(1,nS/2),n:nS+"/2"},
    {t:tm+" min",d:"Cumulées sur la semaine, tous sports.",p:Math.min(1,m/tm),n:Math.round(m)+"/"+tm},
    {t:"3 jours propres",d:"3 jours avec au moins 2 habitudes cochées.",p:Math.min(1,hd/3),n:hd+"/3"},
    {t:"1 pesée",d:"Toujours le même jour, au réveil.",p:weighed,n:weighed+"/1"}
  ];
  const done=qs.filter(q=>q.p>=1).length;
  if(p.quests[w]==null||done>p.quests[w])p.quests[w]=done;
  const bm=Math.max(p.bestWeek||0,m);p.bestWeek=bm;
  return {w,qs,done,nS,m,tm,hd,weighed};
}
function presetList(p){
  const pref=p.settings.pref, groups=PRESETS[p.sport]||PRESETS.autre;
  const times=(pref.times&&pref.times.length?pref.times:[30,45,60]).slice().sort((a,b)=>a-b);
  const lo=times[0], hi=times[times.length-1], mid=(lo+hi)/2;
  const style=pref.int||"mix";
  const pool=[];
  Object.keys(groups).forEach(g=>groups[g].forEach(x=>pool.push(Object.assign({g:g},x))));
  const styleScore=x=>{
    if(style==="mix")return x.g==="mix"?0:1;
    if(x.g===style)return 0;
    if(x.g==="mix")return 1;
    return 2;
  };
  /* Une séance plus courte que le créneau dispo est le vrai défaut : on la
     paie cher. Dépasser un peu est toléré (personne ne se plaint de rouler 10 de plus). */
  const fitScore=x=>{
    if(x.m>=lo&&x.m<=hi)return 0;
    const under=x.m<lo?lo-x.m:0, over=x.m>hi?x.m-hi:0;
    return Math.min(12,Math.round(under/4+over/14)+1);
  };
  return pool
    .map(x=>{
      const f=fitScore(x);
      const closeness=Math.abs(x.m-mid)/Math.max(20,mid);
      return {x:x,s:f*3+styleScore(x)+(x.m>=lo&&x.m<=hi?1-Math.min(0.9,Math.abs(x.m-hi)/Math.max(20,hi)):0)+closeness*0.4};
    })
    .sort((a,b)=>a.s-b.s)
    .slice(0,times.length<=1?4:6)
    .map(o=>o.x);
}

function checkBadges(p){
  const got=[];
  BADGES.forEach(b=>{
    if(p.badges.indexOf(b.id)>=0)return;
    let ok=false;try{ok=!!b.p(p);}catch(e){ok=false;}
    if(ok){p.badges.push(b.id);got.push(b);}
  });
  return got;
}
function checkLevel(p){
  const x=xpOf(p), i=lvlOf(x), up=i>(p.lvl||0);
  if(up)p.lvl=i;
  p.xp=x;
  return up?i:-1;
}

/* ============================================================ ACTIONS */
function addSession(p,o){
  p.sessions.push(Object.assign({date:today(),min:30,int:2,sport:p.sport,demo:!!p.demo},o));
  const xp=Math.round((o.min||0)*(SPORTS[o.sport||p.sport].xpMin||2)+25+((o.int||2)>=4?30:(o.int||2)===3?10:0)+(o.hiit?50:0));
  afterLog(p,"Séance enregistrée", "+"+xp+" XP");
}
function addWeight(p,kg){
  const d=today(), ex=p.weights.find(w=>w.date===d);
  if(ex)ex.kg=kg;else p.weights.push({date:d,kg:kg,demo:!!p.demo});
  afterLog(p,"Pesée enregistrée","+20 XP");
}
function toggleHabit(p,d,i){
  const a=(p.habits[d]?p.habits[d].slice():p.track.map(()=>false));
  while(a.length<p.track.length)a.push(false);
  a[i]=!a[i];
  p.habits[d]=a;
  save();render();
  const n=a.filter(Boolean).length;
  if(n===p.track.length&&n>0){toast("🌟 Journée parfaite","Tout coché · +"+(n*5)+" XP");vibe([10,40,10]);}
}
function useJoker(p){
  const j=p.settings.joker||{used:0,week:curWeek()};
  if(j.week!==curWeek()){j.week=curWeek();j.used=0;}
  if(j.used){toast("🃏 Joker déjà pris","Il revient lundi. C'en était un bon.");return;}
  j.used=1;p.settings.joker=j;
  toast("🃏 Joker utilisé","+30 XP · Bon repas, zéro question.");vibe(20);save();render();
}
function afterLog(p,title,sub){
  const g=checkBadges(p), up=checkLevel(p);
  save();render();
  toast("✅ "+title,sub);
  if(up>=0){confetti();vibe([20,60,20,60,60]);toast("🎿 Niveau "+(up+1),levelName(p,up));}
  g.forEach((b,i)=>setTimeout(()=>{confetti(14);toast("🏅 Badge · "+b.n,"+100 XP (déjà comptés dans le total)");vibe([15,40,15]);},320+i*280));
  const d=p.demo?null:paceDelta(p);
  if(d!=null&&p.goal.metric==="kg"){
    setTimeout(()=>toast(d>=0?"📈 Dans les temps":"📉 Léger retard",Math.abs(d).toFixed(2)+" kg vs trajectoire idéale"),g.length?1200:420);
  }
}
function quickLog(min){
  const p=ap();if(!p)return;
  addSession(p,{min:min,int:min<=20?3:2,t:min<=20?"Séance express "+min+"′":"Sortie "+min+" min"});
}
function logPreset(ix){
  const p=ap();if(!p)return;
  const s=presetList(p)[ix];
  if(!s)return;
  addSession(p,{min:s.m,int:s.x>=6?4:3,hiit:!!s.x,t:s.t});
}
function togTime(t){
  const p=ap();if(!p)return;
  const a=p.settings.pref.times, i=a.indexOf(t);
  if(i>=0){if(a.length>1)a.splice(i,1);}else{a.push(t);a.sort((x,y)=>x-y);}
  save();render();
}
function setInt(k){const p=ap();if(!p)return;p.settings.pref.int=k;save();render();}

  addSession(p,{

function delSess(ix){

  p.badges=p.badges.filter(id=>{const b=BADGES.find(x=>x.id===id);if(!b||b.permanent)return true;try{return !!b.p(p);}catch(e){return true;}});
  p.xp=xpOf(p);p.lvl=lvlOf(p.xp);

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c];});}
function toast(t,sub){
  const w=document.getElementById("toast");
  const d=document.createElement("div");
  d.className="tst";d.innerHTML=esc(t)+(sub?"<small>"+esc(sub)+"</small>":"");
  w.appendChild(d);
  setTimeout(()=>{d.style.transition=".4s";d.style.opacity="0";d.style.transform="translateY(10px)";},2800);
  setTimeout(()=>d.remove(),3300);
  while(w.children.length>4)w.removeChild(w.firstChild);
}
function vibe(x){try{if(navigator.vibrate)navigator.vibrate(x);}catch(e){}}
function confetti(n){

  for(let i=0;i<n;i++){

/* ============================================================ DUEL FAMILLE
   Le duel ne demande aucun serveur : chaque téléphone compte ses minutes
   chez lui, puis on échange un mini-code (~70 caractères) par SMS, en
   discussion de famille, ou en passant le téléphone. Gratuit à 100 %. */
const METRICS={
  min: {n:"Minutes de sport",unit:"min",goal:150},
  sess:{n:"Nombre de séances",unit:"séances",goal:4},
  hab: {n:"Jours avec une habitude cochée",unit:"jours",goal:5},
  boss:{n:"Quêtes bouclées",unit:"quêtes",goal:4}
};
function metricScore(pid,week,metric){
  const p=STATE.profiles.find(x=>x.id===pid);
  if(!p)return 0;
  if(metric==="min")return weekMin(p,week);
  if(metric==="sess")return sess(p).filter(s=>wkKey(s.date)===week).length;
  if(metric==="hab"){let n=0;for(let i=0;i<7;i++){if(habCount(p,ymd(new Date(t0(week)+i*DAY)))>=1)n++;}return n;}
  if(metric==="boss")return (p.quests&&p.quests[week])||0;
  return 0;
}
function nameOf(pid){const p=STATE.profiles.find(x=>x.id===pid);return p?p.name:"?";}
function playerGoal(d,pid){return (d.targets&&d.targets[pid])||d.goal||METRICS[d.metric].goal;}
function heldWeeks(d,pid){
  return Object.keys(d.score||{}).filter(w=>{const v=(d.score[w]||{})[pid]||0;return v>0&&v>=playerGoal(d,pid);}).length;
}
function duelStandings(d){
  const pts={};
  d.players.forEach(pid=>{pts[pid]=0;});
  Object.keys(d.score||{}).forEach(wk=>{
    const round=d.score[wk]||{};
    const rows=d.players.filter(pid=>round[pid]!==undefined)
      .map(pid=>({pid:pid,v:round[pid]||0,goal:playerGoal(d,pid)}))
      .sort((a,b)=>b.v-a.v);
    if(!rows.length)return;
    rows.forEach(r=>{if(r.goal>0&&r.v>=r.goal)pts[r.pid]+=1;});
    const tops=rows.filter(r=>r.v===rows[0].v&&r.v>0);
    let win=null;
    if(tops.length===1)win=tops[0];
    else{const h=tops.filter(r=>r.goal>0&&r.v>=r.goal);if(h.length===1)win=h[0];}
    if(win)pts[win.pid]+=3;
  });
  const order={};d.players.forEach(function(pid,ix){order[pid]=ix;});
  return d.players.map(pid=>({pid:pid,pts:pts[pid]||0})).sort(function(x,y){return (y.pts-x.pts)||(order[x.pid]-order[y.pid]);});
}

function saveDuel(){

  d.name=(document.getElementById("d-name").value||"").trim()||"Duel";
  d.stake=(document.getElementById("d-stake").value||"").trim();
  d.weeks=Math.max(1,Math.min(12,+document.getElementById("d-weeks").value||6));
  d.goal=Math.max(1,Math.min(1000,+document.getElementById("d-goal").value||150));

function tapWin(id,pid){
  const d=duels().find(x=>x.id===id);
  if(!d)return;
  const wk=curWeek();
  d.score=d.score||{};
  d.score[wk]=d.score[wk]||{};
  d.players.forEach(p=>{if(d.score[wk][p]===undefined)d.score[wk][p]=metricScore(p,wk,d.metric);});
  const best=Math.max.apply(null,d.players.map(p=>d.score[wk][p]||0));
  d.score[wk][pid]=Math.max(d.score[wk][pid]||0,best+1);
  const mine=ap();if(mine){checkBadges(mine);checkLevel(mine);}
  save();render();
  toast("⚔️ "+nameOf(pid)+" marque le point","Semaine du "+fmtD(wk));
  confetti(14);vibe([15,40,15]);
}
function duelCode(d){
  const wk=curWeek();
  const rows=d.players.map(pid=>{
    const p=STATE.profiles.find(x=>x.id===pid);
    const nm=String(p&&p.name||"?").replace(/[|:;]/g,"").slice(0,10);
    return nm+":"+Math.round(metricScore(pid,wk,d.metric))+":"+Math.round(playerGoal(d,pid));
  });
  return "TFD1-"+b64enc(d.id+"|"+wk+"|"+d.metric+"|"+rows.join(";")).replace(/=+$/,"");
}
function duelDecode(str){
  const m=String(str||"").trim().match(/^TFD1-([A-Za-z0-9+/]+)$/);
  if(!m)return null;
  try{
    const parts=b64dec(m[1]).split("|");
    if(parts.length!==4)return null;
    const rows=parts[3].split(";").filter(Boolean).map(r=>{const a=r.split(":");return {name:a[0],v:+a[1]||0,goal:+a[2]||0};});
    if(!rows.length)return null;
    return {id:parts[0],week:parts[1],metric:parts[2],rows:rows};
  }catch(e){return null;}
}
function applyDuelCode(code){
  const open=duels().filter(d=>!d.closed);
  for(const duel of open){
    const parsed=duelDecode(code);
    if(!parsed||parsed.id!==duel.id)continue;
    duel.score=duel.score||{};
    duel.score[parsed.week]=duel.score[parsed.week]||{};
    duel.targets=duel.targets||{};
    let n=0;
    parsed.rows.forEach(r=>{
      const p=STATE.profiles.find(x=>String(x.name).toLowerCase()===String(r.name).toLowerCase());
      if(!p)return;
      const prev=duel.score[parsed.week][p.id];
      duel.score[parsed.week][p.id]=Math.max(prev||0,r.v);
      if(r.goal)duel.targets[p.id]=r.goal;
      n++;
    });
    if(!n)return null;
    const mine=ap();if(mine){checkBadges(mine);checkLevel(mine);}
    save();render();
    return {week:parsed.week,n:n};
  }
  return null;
}

function copyDuel(){
  const el=document.getElementById("d-out");
  if(!el)return;
  const fallback=()=>{el.select();toast("Code sélectionné","Copie-le avec Ctrl+C.");};
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(el.value).then(()=>toast("📋 Code copié","Envoie-le dans la conversation famille."),fallback).catch(fallback);
    else fallback();
  }catch(e){fallback();}
}
function shareDuel(){
  const el=document.getElementById("d-out");
  if(!el)return;
  if(navigator.share)navigator.share({title:"Duel famille",text:el.value}).catch(()=>copyDuel());
  else copyDuel();
}
function pasteDuel(){
  const box=document.getElementById("d-in");
  const v=(box&&box.value||"").trim();
  if(!v){toast("Colle d'abord un code 🙂");return;}
  const res=applyDuelCode(v);
  if(res){closeEd();toast("✅ Score importé","Semaine "+fmtD(res.week)+" · "+res.n+" joueur(s)");}
  else toast("Code non reconnu","Il doit commencer par TFD1- et venir d'un duel encore ouvert.");
}
function closeDuel(id){
  const d=duels().find(x=>x.id===id);
  if(!d)return;
  if(!confirm("Clôturer ce duel ? Le classement final est conservé."))return;
  d.closed=true;save();render();
  const st=duelStandings(d);
  confetti(30);vibe([20,60,20,60,20,60,60]);
  toast("🏁 Duel terminé","Victoire de "+nameOf((st[0]||{}).pid));
}

function saveEd(){

  let p=ED.fresh?ED.profile:STATE.profiles.find(function(x){return x.id===ED.id;});
  if(!p){closeEd();return;}
  p.name=v("e-name").trim()||"Sans nom";
  p.sport=v("e-sport");

  p.settings=p.settings||{};
  p.settings.pref=p.settings.pref||{times:[30,45,60],int:"mix",pool:25};

  const ei=document.querySelector("#e-int .chip.onw");p.settings.pref.int=ei?ei.dataset.i:"mix";
  p.settings.pref.pool=Math.max(10,Math.min(100,num("e-pool")||25));
  p.goal=p.goal||{};
  p.goal.weeklyMin=Math.max(20,Math.min(1200,num("e-wm")||120));

  p.goal.startD=v("e-startd")||today();p.goal.targetD=v("e-targetd")||"2027-04-30";
  p.goal.unit=p.goal.metric;
  const chosen=[].filter.call(document.querySelectorAll("input[data-h]"),function(e){return e.checked;}).map(function(e){return DEFHABITS[+e.dataset.h];});
  p.track=chosen.map(function(h){return {key:h.k,lab:h.t};});
  const cust=v("e-hab2").trim();
  if(cust)p.track.push({key:"custom",lab:cust,custom:true});
  if(!p.track.length)p.track=[{key:"move",lab:"Bouger au moins 20 minutes"}];
  const bts=[].slice.call(document.querySelectorAll("input[data-bt]")), bms=[].slice.call(document.querySelectorAll("input[data-bm]"));
  if(!p.bosses)p.bosses=(DEFBOSSES[p.sport]||DEFBOSSES.autre).map(function(b){return {m:b.m,t:b.t,d:b.d,x:b.x,done:false};});
  bts.forEach(function(e,ix){if(!p.bosses[ix])return;p.bosses[ix].t=e.value.trim()||p.bosses[ix].t;const m=(bms[ix]||{}).value||"";if(/^\d{4}-\d{2}$/.test(m.trim()))p.bosses[ix].m=m.trim();});
  p.sessions=p.sessions||[];p.weights=p.weights||[];p.habits=p.habits||{};p.badges=p.badges||[];p.quests=p.quests||{};

    p.bosses.forEach(function(b,ix){b.t=def[ix].t;b.d=def[ix].d;b.x=def[ix].x;b.m=def[ix].m;b.done=false;});
  }

function demoFamily(){
  if(STATE.profiles.length&&!confirm("Ajouter une famille de démo à côté de tes profils ?"))return;
  const mk=function(name,emoji,sport,goal){
    const p=newProfile(name,emoji,sport);
    p.goal=Object.assign(p.goal,goal);p.demo=true;
    p.settings.pref={times:[20,30,45,60],int:sport==="velo"?"hiit":sport==="renf"?"easy":"mix",pool:25};
    for(let i=0;i<28;i++){
      const d=addDays(today(),-i);
      if(i%3===0){
        const min=[20,30,45,60][i%4];
        p.sessions.push({date:d,min:min,int:i%4===0?4:2,sport:sport,hiit:(i%4===0&&sport==="velo"),
          t:(PRESETS[sport].hiit[i%PRESETS[sport].hiit.length]||{}).t,km:+(min/7).toFixed(1),
          m:sport==="velo"&&i%5===0?150:0,laps:sport==="natation"?min*2:0,demo:true});
      }
      if(goal.metric==="kg"&&i%7===3)p.weights.push({date:d,kg:+(goal.start-(goal.start-goal.target)*(1-i/28)*0.3).toFixed(1),demo:true});
      if(i%2===0)p.habits[d]=p.track.map(function(_,ix){return ix<2+(i%2);});
    }
    p.bosses[0].done=true;p.bosses[0].when=addDays(today(),-9);
    p.badges=["first"];checkBadges(p);checkLevel(p);
    return p;
  };
  const a=mk("Papa","🚴","velo",{metric:"kg",start:87,curr:85.1,target:72,startD:today(),targetD:"2027-04-30",weeklyMin:150,unit:"kg"});
  const b=mk("Maman","💪","renf",{metric:"min",start:0,curr:0,target:600,startD:today(),targetD:"2027-04-30",weeklyMin:90,unit:"min"});
  const c=mk("Léa","🏊","natation",{metric:"km",start:0,curr:0,target:120,startD:today(),targetD:"2027-04-30",weeklyMin:80,unit:"km"});
  const d=mk("Tim","🏃","course",{metric:"min",start:0,curr:0,target:300,startD:today(),targetD:"2027-04-30",weeklyMin:60,unit:"min"});

  toast("🎲 Famille de démo ajoutée","Marquée « démo » : elle ne fausse pas la vraie progression.");
}

function drawWeight(p){
  const el=document.getElementById("wchart");if(!el)return;
  const g=p.goal||{}, pts=wts(p).slice().sort(function(a,b){return a.date<b.date?-1:1;});
  const W=360,H=190,L=40,R=12,T=16,B=30, iw=W-L-R, ih=H-T-B;
  if(!pts.length){
    el.innerHTML='<text x="'+(W/2)+'" y="'+(H/2)+'" fill="#8b97c4" font-size="12" text-anchor="middle">Pèse-toi une fois pour voir la courbe apparaître</text>';
    return;
  }
  const a=t0(g.startD||pts[0].date), b=Math.max(t0(g.targetD||addDays(today(),60)),a+30*DAY);
  const vals=pts.map(function(x){return x.kg;}).concat(g.start!=null?[g.start]:[],g.target!=null?[g.target]:[]);
  let mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
  const pad=Math.max(0.8,(mx-mn)*0.15);mn-=pad;mx+=pad;
  const X=function(t){return L+(Math.max(a,Math.min(b,t))-a)/Math.max(1,b-a)*iw;};
  const Y=function(v){return T+ih-(v-mn)/(mx-mn)*ih;};
  let s="";
  for(let i=0;i<=3;i++){
    const v=mn+(mx-mn)*i/3, y=Y(v);
    s+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'" stroke="#212a53"/>';
    s+='<text x="'+(L-5)+'" y="'+(y+3.5).toFixed(1)+'" fill="#8b97c4" font-size="9.5" text-anchor="end">'+v.toFixed(1)+'</text>';
  }
  if(g.start!=null&&g.target!=null)
    s+='<line x1="'+X(a).toFixed(1)+'" y1="'+Y(g.start).toFixed(1)+'" x2="'+X(b).toFixed(1)+'" y2="'+Y(g.target).toFixed(1)+'" stroke="#58e6a8" stroke-width="1.6" stroke-dasharray="5 4"/>';
  if(pts.length>1)
    s+='<path d="'+pts.map(function(x,i){return (i?"L":"M")+X(t0(x.date)).toFixed(1)+" "+Y(x.kg).toFixed(1);}).join(" ")+'" fill="none" stroke="#ffd45e" stroke-width="2.6" stroke-linejoin="round"/>';
  pts.forEach(function(x){s+='<circle cx="'+X(t0(x.date)).toFixed(1)+'" cy="'+Y(x.kg).toFixed(1)+'" r="3.2" fill="#ff8a5c"/>';});
  const nw=X(t0(today()));
  s+='<line x1="'+nw.toFixed(1)+'" y1="'+T+'" x2="'+nw.toFixed(1)+'" y2="'+(T+ih)+'" stroke="#63c8ff" stroke-width="1" stroke-dasharray="2 3"/>';
  s+='<text x="'+L+'" y="'+(H-10)+'" fill="#8b97c4" font-size="9.5">'+fmtD(g.startD||pts[0].date)+'</text>';
  s+='<text x="'+(W-R)+'" y="'+(H-10)+'" fill="#8b97c4" font-size="9.5" text-anchor="end">'+fmtD(g.targetD||"")+'</text>';
  el.innerHTML=s;
}
function drawVolume(p){
  const el=document.getElementById("vchart");if(!el)return;
  const W=360,H=190,L=40,R=12,T=16,B=30, iw=W-L-R, ih=H-T-B;
  const wks=[];const start=t0(curWeek());
  for(let i=6;i>=0;i--)wks.push(ymd(new Date(start-i*7*DAY)));
  const data=wks.map(function(k){return {k:k,m:weekMin(p,k)};});
  const tm=targetMin(p);
  const mx=Math.max(tm*1.2,Math.max.apply(null,data.map(function(d){return d.m;})),20);
  const bw=iw/7;
  let s='<line x1="'+L+'" y1="'+(T+ih-tm/mx*ih).toFixed(1)+'" x2="'+(W-R)+'" y2="'+(T+ih-tm/mx*ih).toFixed(1)+'" stroke="#58e6a8" stroke-width="1.3" stroke-dasharray="5 4"/>';
  s+='<text x="'+L+'" y="'+(T+ih-tm/mx*ih-4).toFixed(1)+'" fill="#58e6a8" font-size="9">objectif '+tm+'′</text>';
  data.forEach(function(d,i){
    const h=d.m/mx*ih, x=L+i*bw+bw*0.16, w2=bw*0.68, y=T+ih-h;
    s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w2.toFixed(1)+'" height="'+Math.max(0.5,h).toFixed(1)+'" rx="3" fill="'+(i===6?"#ffd45e":d.m>=tm?"#58e6a8":"#3d4d8f")+'"/>';
    if(d.m>0)s+='<text x="'+(x+w2/2).toFixed(1)+'" y="'+(y-3).toFixed(1)+'" fill="#e8edff" font-size="8.5" text-anchor="middle">'+Math.round(d.m)+'</text>';
    s+='<text x="'+(x+w2/2).toFixed(1)+'" y="'+(H-11)+'" fill="#8b97c4" font-size="8.5" text-anchor="middle">'+fmtD(d.k).slice(0,5)+'</text>';
  });
  s+='<text x="'+(W-R)+'" y="'+(H-11)+'" fill="#ffd45e" font-size="8.5" text-anchor="end">cette semaine →</text>';
  el.innerHTML=s;
}

/* ============================================================ SYNCHRO */
function b64enc(str){
  try{return btoa(unescape(encodeURIComponent(str)));}
  catch(e){const b=new TextEncoder().encode(str);let o="";for(let i=0;i<b.length;i++)o+=String.fromCharCode(b[i]);return btoa(o);}
}
function b64dec(s){
  try{return decodeURIComponent(escape(atob(s)));}
  catch(e){const bin=atob(s),b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return new TextDecoder().decode(b);}
}
function expFile(){
  const blob=new Blob([JSON.stringify(STATE)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="team-famille-"+today()+".json";document.body.appendChild(a);a.click();a.remove();
  toast("💾 Fichier téléchargé","Garde-le : c'est toute la famille dedans.");
}
function copyCode(){
  const c=b64enc(JSON.stringify(STATE));
  const ok=function(){toast("📋 Code copié",c.length+" caractères · colle-le sur l'autre appareil");};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(c).then(ok,function(){showCode(c);});
  else showCode(c);
}
function showCode(c){
  document.getElementById("modal").innerHTML='<div class="modal"><div class="box"><h2 style="font-size:15px;margin:0 0 8px">Code de sauvegarde</h2>'
  +'<textarea rows="8" id="cc" onclick="this.select()">'+c+'</textarea>'
  +'<div class="row" style="margin-top:10px"><button class="gh" onclick="closeEd()">Fermer</button></div></div></div>';
}
function importBox(){const e=document.getElementById("imbox");if(e)e.classList.toggle("hidden");}
function doImport(){
  const t=document.getElementById("imp").value.trim();
  let o=null;
  try{o=JSON.parse(t);}catch(e){try{o=JSON.parse(b64dec(t));}catch(e2){toast("Code ou fichier illisible 🙂");return;}}
  if(!o||!Array.isArray(o.profiles)){toast("Fichier non reconnu");return;}
  let added=0,merged=0;
  o.profiles.forEach(function(np){
    if(!np.id)np.id=uid();
    const mine=STATE.profiles.find(function(p){return p.name===np.name&&p.sport===np.sport;});
    if(mine){
      ["sessions","weights"].forEach(function(k){
        if(Array.isArray(np[k]))np[k].forEach(function(e){
          const dupe=mine[k].some(function(m){return m.date===e.date&&(m.min||0)===(e.min||0)&&(m.kg||0)===(e.kg||0);});
          if(!dupe)mine[k].push(e);
        });
      });
      Object.keys(np.habits||{}).forEach(function(k){if(!mine.habits[k])mine.habits[k]=np.habits[k];});
      mine.settings=Object.assign({},np.settings||{},mine.settings||{});
      mine.settings.pref=Object.assign({times:[30,45,60],int:"mix",pool:25},np.settings&&np.settings.pref||{},mine.settings.pref||{});
      mine.goal=Object.assign({},np.goal||{},mine.goal||{});
      if(!mine.track||!mine.track.length)mine.track=np.track||[];
      if(!mine.habits)mine.habits={};
      if(!mine.badges)mine.badges=[];
      if(!mine.quests)mine.quests={};
      if(!mine.bosses||!mine.bosses.length)mine.bosses=(DEFBOSSES[mine.sport]||DEFBOSSES.autre).map(x=>({m:x.m,t:x.t,d:x.d,x:x.x,done:false}));
      mine.badges=Array.from(new Set((mine.badges||[]).concat(np.badges||[])));
      checkLevel(mine);merged++;
    }else{
      np.id=np.id||uid();
      np.emoji=np.emoji||"⭐";np.name=np.name||"Sans nom";np.sport=SPORTS[np.sport]?np.sport:"autre";
      np.sessions=np.sessions||[];np.weights=np.weights||[];np.habits=np.habits||{};
      np.badges=np.badges||[];np.quests=np.quests||{};np.demo=!!np.demo;
      np.settings=np.settings||{};
      np.settings.pref=Object.assign({times:[30,45,60],int:"mix",pool:25},np.settings.pref||{});
      np.settings.joker=np.settings.joker||{used:0,week:curWeek()};
      np.goal=Object.assign({metric:"kg",start:null,curr:null,target:null,startD:today(),targetD:"2027-04-30",weeklyMin:120,unit:"kg"},np.goal||{});
      np.track=(np.track&&np.track.length)?np.track:DEFHABITS.slice(0,3).map(h=>({key:h.k,lab:h.t}));
      np.bosses=(np.bosses&&np.bosses.length)?np.bosses:(DEFBOSSES[np.sport]||DEFBOSSES.autre).map(x=>({m:x.m,t:x.t,d:x.d,x:x.x,done:false}));
      STATE.profiles.push(np);added++;
    }
  });
  if(!STATE.active&&STATE.profiles.length)STATE.active=STATE.profiles[0].id;
  save();document.getElementById("imp").value="";render();
  toast("🔗 Import terminé","+"+added+" profil(s), "+merged+" fusion(s)");
}
function wipe(){
  if(!confirm("Tout effacer sur cet appareil ? Exporte avant si tu y tiens."))return;
  STATE={v:VERSION,active:null,profiles:[]};save();render();toast("🗑 Rasé");
}

/* ============================================================ RAPPEL */
function armReminder(){
  const p=ap();if(!p){toast("Créez d'abord un profil 🙂");return;}
  const e=document.getElementById("rem");
  const v=(e&&e.value)||"19:00";
  p.settings.remind=v;save();
  if(!("Notification" in window)){toast("Notifications indisponibles ici");render();return;}
  Notification.requestPermission().then(function(pm){
    p.settings.remind=pm==="granted"?v:null;save();render();
    if(pm==="granted"){schedule(v);toast("🔔 Rappel "+v,"Seulement quand l'app est ouverte — sans pression.");}
    else toast("Permission refusée","Le rappel a été coupé.");
  });
}
function clearReminder(){
  const p=ap();if(!p)return;p.settings.remind=null;
  if(remTimer)clearTimeout(remTimer);
  save();render();toast("Rappel coupé");
}
function schedule(v){
  if(remTimer)clearTimeout(remTimer);
  const pr=v.split(":").map(Number), now=new Date();
  const t=new Date(now.getFullYear(),now.getMonth(),now.getDate(),pr[0],pr[1],0);
  if(t<=now)t.setDate(t.getDate()+1);
  remTimer=setTimeout(function(){
    const p=ap();
    try{if(Notification.permission==="granted")new Notification("Team Famille 🚴",{body:(p?p.emoji:"🚴")+" Une petite séance ? 20 minutes et c'est dans la poche.",tag:"teamfam"});}catch(e){}
    toast("🔔 C'est l'heure","Rien d'obligatoire. Mais 20 minutes, ça existe.");
    schedule(v);
  },t-now);
}

if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){

  const p=ap();
  try{if(p&&p.settings&&p.settings.remind&&Notification.permission==="granted")schedule(p.settings.remind);}catch(e){}
}

/* ============================================================ DÉMARRAGE */
function applyHash(){
  const h=(location.hash||"").replace("#","");
  const map={log:"log",journal:"log",duel:"duel",mission:"mission",badges:"badges",fam:"fam",famille:"fam",today:"today"};
  if(map[h]){UI.tab=map[h];}
  else if(h==="weigh"&&ap()){UI.tab="log";UI.after="weigh";}
}
applyHash();
window.addEventListener("hashchange",function(){applyHash();render();setTimeout(function(){if(UI.after==="weigh"){UI.after=null;const f=document.getElementById("w-kg");if(f){f.focus();f.scrollIntoView({block:"center"});}}},80);});
load();
if(STATE.profiles.length){
  if(!STATE.profiles.some(function(p){return p.id===STATE.active;}))STATE.active=STATE.profiles[0].id;
  STATE.profiles.forEach(function(p){p.xp=xpOf(p);p.lvl=lvlOf(p.xp);});
}
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeEd();});
render();
bootReminders();
bootReminders();
